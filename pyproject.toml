[project]
name = "wcm"
version = "0.1.0"
description = "WhatsApp Chaos Management: evidence-backed operational records from WhatsApp exports"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pillow>=10.4",
  "imagehash>=4.3",
  "rapidfuzz>=3.9",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-postgresql>=6.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["imagehash.*", "pdfplumber.*", "docx.*", "rapidfuzz.*", "openpyxl.*", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["golden: acceptance tests derived from golden_cases.yaml"]
xfail_strict = false
