# PLACEHOLDER SEED: the owner's real config/groups.yaml was not available when M0 was built.
# Replace with the owner's file; regexes below are inferred from the examples in the build brief
# and must be re-validated against the real chat lines.
clients:
  tata:
    name: Tata
    identity_model: dealer_code_with_divisions
    dealer_code_regex: '^300[0-9A-Z]\d{3}$'     # e.g. 3007530, 300A490 (300A42 is invalid)
    division_code_regex: '^300[0-9A-Z]\d{3}-.+$'  # e.g. 3007530-Sv&Pa-Chokidhani-RdrMtr
  maruti:
    name: Maruti
    identity_model: outlet_company_channel_town
    channels: [ARENA, NEXA]
groups:
  - name: "Tata Delight Meter Core Group"
    client: tata
  - name: "Maruti Dealers DSS Sales"
    client: maruti
