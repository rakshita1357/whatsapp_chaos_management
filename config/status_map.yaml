# PLACEHOLDER SEED. role -> field -> raw value (casefolded) -> canonical value.
# Role ANY is the fallback when a role-specific entry is missing.
ANY:
  readiness:
    "ready to deploy": ready
    "ready": ready
    "not ready": not_ready
    "pending": not_ready
  dispatch_status:
    "dispatched": dispatched
    "pending": pending
    "not dispatched": pending
