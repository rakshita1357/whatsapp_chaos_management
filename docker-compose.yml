services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wcm
      POSTGRES_PASSWORD: wcm
      POSTGRES_DB: wcm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcm"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
